<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, user-scalable=no">
    <title>Untl</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;500&display=swap');

        .main_wrap {
          height: 100vh;
          color: white;
          display: flex;
          flex-direction: column;
          overflow: visible;
          overflow-x: hidden;
          background: url('/tan/bak');
        }

        .name_wrap {
          display: flex;
          flex-direction: column;
          width: 100vw;
        }

        .nm {
        margin: 8px;
        height: 50px;
        /*border-style: solid;*/
        /*border-color: white;*/
        text-align: center;
          width: 100vw;
          /*border-radius: 5vh;*/
          /*border-width: 1vw;*/
          color: white;
          place-content: center;
          font-size: 31px;
        }

        .card_wrap {
            overflow-y: visible;
            margin-top: 24px;
          display: flex;
          flex-direction: column;
          width: 100vw;
        }


        .fline_cw {
          display: flex;
          flex-direction: row;
          height: 170px;
          width: 100vw;
          justify-content: center;
          gap: 20px;
          /*justify-content: space-around;*/
        }

        .sline_cw {
            margin-top: 20px;
          display: flex;
          flex-direction: row;
          width: 100vw;
          justify-content: center;
          gap: 15px;
        }

        .btn_wr {
            overflow-y: visible;
          display: flex;
          flex-direction: row;
          height: 20vh;
          width: 100vw;
          justify-content: space-around;
        }

        .mn_btn {
        align-self: center;
        align-content: center;
            margin-top: 3.5vh;
            height: 7vh;
          border: 0;
          padding: 0 20px;
          font-size: 4vh;
          color: #fff;
          text-shadow: 1px 1px 1px #000;
          border-radius: 8vw;
          background-image: radial-gradient(circle, rgba(116,30,255,1) 10%, rgba(112,0,209,1) 55%, rgba(175,184,238,1) 98%);
          box-shadow:
            inset 2px 2px 3px rgba(255, 255, 255, 0.6),
            inset -2px -2px 3px rgba(0, 0, 0, 0.6);
        }

        .card_item {
            height: 150px;
            width: 143px;
            width: 20vw;
            display: flex;
            background-size: cover;
            opacity: 1;
            justify-content: center;
            align-items: center;
        }

        .card_item_user {
            height: 150px;
            width: 20vw;
            display: flex;
            background-size: cover;
            opacity: 1;
            justify-content: center;
            align-items: center;
        }

        .card_ph {

            max-height: 148px;
            max-width: 140px;
            /* width: inherit; */
            position: absolute;
        }

        .card_mph {
            max-height: 148px;
            max-width: 140px;
            padding: 2px;
            position: absolute;
            opacity: 0;
        }

      /* general styling */
        :root {
            scrollbar-width: none;
            -ms-overflow-style: none;
            --font-family: "SF Pro Display",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
          }

        :root::-webkit-scrollbar{
            display: none;
          }

        body {
              --color: #000000; /* var(--text-color) */
              scrollbar-width: none;
              color: var(--color);
              display: flex;
              overflow: scroll;
              overflow: scroll;
              transition: none;
              user-select: none;
          }


        * {
              padding: 0;
              margin: 0;
              box-sizing: border-box;
              transition: color,background .4s ease-in-out;
              font-family: var(--font-family);
              font-size: 17px;
              color: #000000;
              user-select: none;
              overflow: scroll;
          }

        *::-webkit-scrollbar{
              display: none;
          }

        img,
          svg {
            max-width: 100%;
            max-height: 100%;
            display: block;
          }


    </style>
  </head>
  <body>

        function snddt() {
            let data = {

            }
            let tg = window.Telegram.WebApp;
            tg.sendData(JSON.stringify(data));

  </body>
</html>
